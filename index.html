<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Inventaris Roti</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1><i class="fa-solid fa-bread-slice"></i> Sistem Inventaris Roti</h1>
      <p>Kelola data dan persediaan roti dengan mudah.</p>
    </header>

    <section class="form-container">
      <h2 id="formTitle">Tambah Data Roti</h2>
      <form id="formData">
        <input type="hidden" id="id">

        <div class="form-grid">
          <div class="form-group">
            <label for="nama"><i class="fa-solid fa-bread-slice"></i> Nama Roti</label>
            <div class="input-group">
              <span class="input-icon"><i class="fa-solid fa-cube"></i></span>
              <input type="text" name="nama" id="nama" placeholder="Contoh: Croissant, Roti Tawar" required>
            </div>
          </div>

          <div class="form-group">
            <label for="harga"><i class="fa-solid fa-money-bill"></i> Harga Satuan (Rp)</label>
            <div class="input-group">
              <span class="input-icon"><i class="fa-solid fa-dollar-sign"></i></span>
              <input type="number" name="harga" id="harga" placeholder="Contoh: 15000" min="0" step="1" required>
            </div>
          </div>

          <div class="form-group">
            <label for="kategori"><i class="fa-regular fa-folder-open"></i> Kategori Roti</label>
            <div class="input-group">
              <span class="input-icon"><i class="fa-regular fa-folder-open"></i></span>
              <select id="kategori" name="kategori" required>
                <option value="">Pilih Kategori</option>
                <option value="Roti Manis">Roti Manis</option>
                <option value="Roti Tawar">Roti Tawar</option>
                <option value="Pastry">Pastry</option>
                <option value="Croissant">Croissant</option>
                <option value="Donat">Donat</option>
              </select>
            </div>
          </div>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-add" id="submitButton">
            <i class="fa-solid fa-plus"></i> Tambahkan ke Stok
          </button>
          <button type="button" class="btn-reset" id="resetButton">Reset Form</button>
        </div>
      </form>
    </section>

    <section class="table-container">
      <div class="table-heading">
        <div>
          <h2>Daftar Inventaris Roti</h2>
        </div>
        <button type="button" class="btn-refresh" id="refreshButton">
          <i class="fa-solid fa-rotate"></i> Muat Ulang
        </button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>Nama Roti</th>
              <th>Kategori</th>
              <th>Harga Satuan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableData">
            <tr><td colspan="5" class="empty-state">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
      <p id="statusMessage" class="status-message" role="status"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
